<div class="desk f-nova" id="desk">
  <!-- a mark on Nova (Darstellung → Logo): Akari OS or lucya.systems -->

    <svg class="desk__mark desk__mark--akari am" viewBox="0 0 95.64 100"><use href="#am"/></svg>
    <svg class="desk__mark desk__mark--lucya" viewBox="0 0 964 543"><use href="#lm"/></svg>
  </div>
  <!-- the phone's home screen (only under 640 px): the time, then every app -->
  <section class="home" id="home" aria-label="Home-Bildschirm">
    <header class="home__head"><time class="home__time" id="home-time"></time><span class="home__date" id="home-date"></span></header>
    <div class="home__apps" id="home-apps"></div>
  </section>
  <div class="icons" id="icons"></div>
  <div class="widgets" id="widgets"></div>
  <!-- Farbverlauf: the pastel rainbow over the desk (akari.css) -->
  <div class="desk__spectrum" aria-hidden="true"></div>
  <div class="windows" id="windows"></div>

  <!-- the taskbar: two floating pills, apps left, status right -->
  <div class="taskbar" id="taskbar">
    <nav class="tb tb--apps f-glass f-glass--hi f-glass--deep" aria-label="Apps">
      <button class="tb__launch" id="brand" aria-haspopup="menu" aria-expanded="false" aria-label="Akari-Menü">
        <svg class="am" viewBox="0 0 95.64 100" aria-hidden="true"><use href="#am"/></svg>
      </button>
      <span class="tb__sep"></span>
      <div class="tb__dock" id="dock"></div>
      <span class="tb__sep" id="tb-min-sep" hidden></span>
      <div class="tb__min" id="tb-min" aria-label="Minimierte Fenster"></div>
    </nav>
    <div class="tb tb--status f-glass f-glass--hi f-glass--deep">
      <button class="tb__desk f-tip" id="bar-desk" data-tip="Desktop wechseln" aria-label="Desktop wechseln" hidden><svg><use href="#i-desks"/></svg><span translate="no"></span></button>
      <span class="tb__sep" id="tb-desk-sep" hidden></span>
      <div class="tb__media" id="tb-media" hidden>
        <button class="tb__cover f-tip" data-media="show" data-tip="Zum Player"><img alt="" hidden draggable="false"><svg><use href="#i-music"/></svg></button>
        <span class="tb__track"><b translate="no"></b><small translate="no"></small></span>
        <span class="tb__mctl">
          <button class="tb__mbtn" data-media="previous" aria-label="Zurück"><svg><use href="#i-prev"/></svg></button>
          <button class="tb__mbtn tb__mbtn--main" data-media="play-pause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
          <button class="tb__mbtn" data-media="next" aria-label="Weiter"><svg><use href="#i-next"/></svg></button>
        </span>
      </div>
      <span class="tb__sep" id="tb-media-sep" hidden></span>
      <span class="tb__state">
        <svg class="f-tip" id="tb-net" data-tip="Mit dem Workspace verbunden" tabindex="0"><use href="#i-net"/></svg>
        <span class="tb__batt f-tip" id="tb-batt" data-tip="" tabindex="0" hidden><svg><use href="#i-battery"/></svg><i></i></span>
      </span>
      <span class="tb__sep"></span>
      <button class="tb__btn f-tip" id="tb-quick" data-tip="Schnelleinstellungen" aria-label="Schnelleinstellungen" aria-haspopup="dialog"><svg><use href="#i-sliders"/></svg></button>
      <button class="tb__btn f-tip" id="tb-bell" data-tip="Mitteilungen" aria-label="Mitteilungen" aria-haspopup="dialog"><svg><use href="#i-bell"/></svg><span class="tb__dot" id="tb-bell-dot" hidden></span></button>
      <span class="tb__sep"></span>
      <button class="tb__clock" id="tb-clock" aria-haspopup="dialog"><time id="clock">--:--</time><span id="clock-date"></span></button>
    </div>
  </div>
  <div class="dock-edge" id="dock-edge" aria-hidden="true"></div>

  <!-- the start menu: search, apps, recent, who and the way out -->
  <div class="pop pop--launch f-glass f-glass--hi f-glass--deep" id="brand-menu" role="dialog" aria-label="Startmenü" hidden>
    <label class="f-search launch__search"><svg><use href="#i-search"/></svg><input class="f-input" id="launch-q" placeholder="Apps, Einstellungen, Dateien suchen" aria-label="Suchen" autocomplete="off"></label>

      <section class="launch__sec" data-sec="apps">

  <!-- quick settings: a control centre of modules -->

        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">Konten</h2></header>
        <p class="f-dim page__lede">Jedes Konto ist ein eigener Linux-Benutzer mit eigenem Home. Was ein Konto startet, läuft unter seiner Kennung; die anderen kommen nicht an seine Dateien.</p>
        <div class="grp" data-accounts></div>
        <span class="f-label grp__label">Neues Konto</span>
        <form class="grp grp--form" data-form="new" autocomplete="off">
          <label class="f-field"><span>Name</span><input class="f-input" name="fullname" maxlength="64" autocomplete="off"></label>
          <label class="f-field"><span>Benutzername</span><input class="f-input" name="user" maxlength="32" required spellcheck="false" autocomplete="off"><small>Kleinbuchstaben, Ziffern, - und _.</small></label>
          <label class="f-field"><span>Passwort</span><input class="f-input" type="password" name="password" minlength="8" required autocomplete="new-password"></label>
          <label class="f-check"><input type="checkbox" name="admin">Darf Konten verwalten</label>
          <div class="grp__foot"><span class="f-dim" data-state></span><button class="f-btn f-btn--primary" type="submit">Anlegen</button></div>
        </form>
      </section>

      <section class="page" data-page="software" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">Software</h2></header>
        <p class="f-dim page__lede">Akari OS ist ein Debian. Konten, die verwalten, installieren Programme mit sudo und apt im Terminal, mit ihrem Passwort.</p>
        <div class="grp">
          <div class="opt"><span class="opt__txt"><b>sudo</b><small data-sw-state>–</small></span><span class="f-badge" data-sw-badge>–</span></div>
          <div class="opt opt--stack" data-sw-howto hidden>
            <span class="opt__txt"><b>Installieren</b><small>Im Terminal:</small></span>
            <code class="ssh-cmd">sudo apt update &amp;&amp; sudo apt install htop</code>
            <button class="f-btn f-btn--sm f-btn--primary opt__go" data-open="terminal" data-new><svg><use href="#i-term"/></svg>Terminal öffnen</button>
          </div>
        </div>
        <div class="grp">
          <div class="opt"><span class="opt__txt"><b>Alle Programme zeigen</b><small>Auch Terminal-Programme wie htop, XTerm und die Einstellungen anderer Desktops im Startmenü. Sonst startest du sie im Terminal.</small></span><label class="f-switch"><input type="checkbox" data-pref="showAllApps"><i></i><span class="sr">Alle Programme zeigen</span></label></div>
        </div>
        <span class="f-label grp__label">Updates</span>
        <div class="grp" data-up>
          <div class="opt">
            <span class="opt__txt"><b data-up-title>–</b><small data-up-state>–</small></span>
            <span class="opt__acts" data-up-admin>
              <button class="f-btn f-btn--sm" data-up-job="check"><svg><use href="#i-refresh"/></svg>Suchen</button>
              <button class="f-btn f-btn--sm f-btn--primary" data-up-job="install" hidden>Installieren</button>
            </span>
          </div>
          <div class="up__list" data-up-list hidden></div>
          <pre class="up__log" data-up-log hidden></pre>
        </div>
        <p class="f-dim page__lede" data-sw-count></p>
      </section>

      <section class="page" data-page="netzwerk" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">Netzwerk</h2></header>
        <p class="f-dim page__lede">Wie Akari OS im Netz steht. Eingerichtet wird das Netz von Debian (DHCP aus dem Installer); hier steht, was es gerade hat.</p>
        <div class="grp">
          <div class="opt"><span class="opt__txt"><b>Im Browser</b><small data-net-url>–</small></span><span class="f-badge" data-net-badge>–</span></div>
          <div class="opt"><span class="opt__txt"><b>Router</b><small data-net-gw>–</small></span></div>
          <div class="opt"><span class="opt__txt"><b>DNS</b><small data-net-dns>–</small></span></div>
        </div>
        <span class="f-label grp__label">Anschlüsse</span>
        <div class="grp" data-net-ifs></div>
      </section>

      <section class="page" data-page="zeit" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">Datum &amp; Uhrzeit</h2></header>
        <p class="f-dim page__lede">Die Uhr des Systems: für Dateien, Protokolle und alle Konten gleich.</p>
        <div class="grp">
          <div class="opt"><span class="opt__txt"><b data-tz-now>–</b><small data-tz-date>–</small></span></div>
          <div class="opt">
            <span class="opt__txt"><b>Zeitzone</b><small data-tz-name>–</small></span>
            <select class="f-input f-select tz__pick" data-tz-pick aria-label="Zeitzone" hidden></select>
          </div>
          <div class="opt">
            <span class="opt__txt"><b>Zeit aus dem Netz</b><small data-ntp-state>–</small></span>
            <label class="f-switch" data-ntp-admin><input type="checkbox" data-ntp><i></i><span class="sr">Zeit aus dem Netz</span></label>
          </div>
        </div>
        <p class="f-dim page__lede" data-tz-nonadmin hidden>Zeitzone und Zeit ändert ein Konto, das verwalten darf.</p>
      </section>

      <section class="page" data-page="ssh" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">SSH</h2></header>
        <p class="f-dim page__lede">Von einem anderen Rechner aus in deine Shell in Akari OS: gleiche Dateien, gleiches zsh, gleicher Benutzer.</p>
        <div class="grp">
          <div class="opt">
            <span class="opt__txt"><b>SSH-Zugang</b><small data-ssh-state>–</small></span>
            <label class="f-switch" data-ssh-admin><input type="checkbox" data-ssh-on><i></i><span class="sr">SSH-Zugang</span></label>
          </div>
          <div class="opt opt--stack" data-ssh-connect hidden>
            <span class="opt__txt"><b>Verbinden</b><small>In einem Terminal auf deinem Rechner:</small></span>
            <code class="ssh-cmd" data-ssh-cmd></code>
            <small class="f-dim ssh-fp" data-ssh-fp></small>
          </div>
        </div>
        <span class="f-label grp__label">Meine Schlüssel</span>
        <div class="grp" data-ssh-keys></div>
        <form class="grp grp--form" data-form="sshkey" autocomplete="off">
          <label class="f-field"><span>Öffentlichen Schlüssel hinzufügen</span><textarea class="f-input ssh-key-in" name="key" rows="3" spellcheck="false" placeholder="ssh-ed25519 AAAA… du@laptop" required></textarea><small>Der Inhalt von ~/.ssh/id_ed25519.pub auf deinem Rechner. Nie den privaten Schlüssel.</small></label>
          <div class="grp__foot"><span class="f-dim" data-state></span><button class="f-btn f-btn--primary" type="submit">Hinzufügen</button></div>
        </form>
        <span class="f-label grp__label">Passwort</span>
        <div class="grp">
          <div class="opt">
            <span class="opt__txt"><b>Anmeldung mit Passwort erlauben</b><small>Mit deinem Passwort statt eines Schlüssels. Bequemer, aber angreifbar, sobald der Port im Netz steht.</small></span>
            <label class="f-switch"><input type="checkbox" data-ssh-pw><i></i><span class="sr">Anmeldung mit Passwort erlauben</span></label>
          </div>
        </div>
      </section>

      <section class="page" data-page="lucent" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">Lucent</h2></header>
        <p class="f-dim page__lede">Lucent verwaltet Akari OS von außen: Zustand, Konten, SSH und Wartung auf seinen Seiten, Anmelden mit einem Lucent-Konto. Akari behält seine eigene Oberfläche und läuft auch ohne Lucent weiter.</p>
        <div class="grp" data-lu-paired hidden>
          <div class="opt"><span class="opt__txt"><b>Gekoppelt</b><small data-lu-state>–</small></span><span class="f-badge f-badge--ok">verbunden</span></div>
          <div class="opt" data-lu-admin><span class="opt__txt"><b>Entkoppeln</b><small>Lucent sieht Akari danach nicht mehr, Anmelden mit Lucent geht nicht mehr. In Lucent das Tool auch dort entfernen.</small></span><button class="f-btn f-btn--sm f-btn--danger" data-lu-leave>Entkoppeln</button></div>
        </div>
        <form class="grp grp--form" data-form="lucent" autocomplete="off" hidden>
          <label class="f-field"><span>Adresse von Lucent</span><input class="f-input" name="lucent_url" type="url" placeholder="https://lucent.example" required spellcheck="false"></label>
          <label class="f-field"><span>Code</span><input class="f-input" name="code" placeholder="ABCD-EFGH-JKLM" required spellcheck="false" autocapitalize="characters"><small>In Lucent unter Tools → Code erzeugen. Gilt 15 Minuten und einmal.</small></label>
          <label class="f-field"><span>Adresse von Akari</span><input class="f-input" name="ui_url" type="url" required spellcheck="false"><small>So öffnet ein Browser Akari OS. Dorthin kommt man nach „Mit Lucent anmelden“ zurück.</small></label>
          <label class="f-field"><span>Adresse für Lucent (wenn anders)</span><input class="f-input" name="base_url" type="url" spellcheck="false" placeholder="leer: wie oben"><small>Wo Lucent Akari erreicht, etwa http://akari:8130 im Docker-Netz.</small></label>
          <div class="grp__foot"><span class="f-dim" data-state></span><button class="f-btn f-btn--primary" type="submit">Koppeln</button></div>
        </form>
        <p class="f-dim page__lede" data-lu-nonadmin hidden>Noch nicht gekoppelt. Koppeln darf ein Konto, das verwalten darf.</p>
        <span class="f-label grp__label" data-lu-me-label hidden>Mein Konto</span>
        <div class="grp" data-lu-me hidden>
          <div class="opt"><span class="opt__txt"><b>Mit Lucent anmelden</b><small data-lu-me-state>–</small></span><button class="f-btn f-btn--sm" data-lu-link>Verknüpfen</button></div>
        </div>
      </section>

      <section class="page" data-page="workspace" hidden>
        <header class="page__head"><button class="f-btn f-btn--ghost f-btn--icon page__back" data-back aria-label="Zurück"><svg><use href="#i-back"/></svg></button><h2 class="f-h2">System</h2></header>
        <div class="about">
          <svg class="am about__mark" viewBox="0 0 95.64 100" aria-hidden="true"><use href="#am"/></svg>
          <div><b class="f-subtitle" data-sys="osname">Akari OS</b><p class="f-dim" data-sys="about-line">–</p><span class="about__by">von <span class="wordmark" role="img" aria-label="lucya.systems"></span></span></div>
        </div>
        <div class="grp">
          <dl class="f-metrics f-metrics--lined info">
            <div class="f-metric"><dt>Akari OS</dt><dd class="f-metric__value f-metric__value--plain" data-sys="version">–</dd></div>
            <div class="f-metric"><dt>System</dt><dd class="f-metric__value f-metric__value--plain" data-sys="os">–</dd><dd class="f-metric__note" data-sys="kernel"></dd></div>
            <div class="f-metric"><dt>Angemeldet</dt><dd class="f-metric__value f-metric__value--plain" data-sys="user">–</dd></div>
            <div class="f-metric"><dt>Home</dt><dd class="f-metric__value f-metric__value--plain" data-sys="home">–</dd><dd class="f-metric__note">Nur du kommst hinein. Der Rest des Systems ist nur lesbar.</dd></div>
            <div class="f-metric"><dt>Datenträger</dt><dd class="f-metric__value f-metric__value--plain" data-sys="disk">–</dd><dd class="f-metric__note"><div class="f-meter"><b data-sys-meter="disk"></b></div></dd></div>
            <div class="f-metric"><dt>Arbeitsspeicher</dt><dd class="f-metric__value f-metric__value--plain" data-sys="memory">–</dd><dd class="f-metric__note"><div class="f-meter"><b data-sys-meter="memory"></b></div></dd></div>
            <div class="f-metric"><dt>Läuft seit</dt><dd class="f-metric__value f-metric__value--plain" data-sys="uptime">–</dd></div>
            <div class="f-metric"><dt>Prozesse</dt><dd class="f-metric__value f-metric__value--plain" data-sys="processes">–</dd></div>
            <div class="f-metric"><dt>Linux-Apps</dt><dd class="f-metric__value f-metric__value--plain" data-sys="apps">–</dd></div>
            <div class="f-metric"><dt>Verwaltet von</dt><dd class="f-metric__value f-metric__value--plain" data-sys="managed">–</dd></div>
          </dl>
        </div>
        <span class="f-label grp__label">Gerät</span>
        <div class="grp">
          <div class="opt"><span class="opt__txt"><b>Gerätename</b><small data-host="name">–</small></span><button class="f-btn f-btn--sm" data-host-rename data-host-admin hidden>Ändern</button></div>
          <div class="opt"><span class="opt__txt"><b>Prozessor</b><small data-host="cpu">–</small></span></div>
          <div class="opt"><span class="opt__txt"><b>Läuft auf</b><small data-host="virt">–</small></span></div>
        </div>
        <span class="f-label grp__label">Datenträger</span>
        <div class="grp" data-host-disks></div>
        <span class="f-label grp__label" data-host-admin hidden>Ein/Aus</span>
        <div class="grp" data-host-admin hidden>
          <div class="opt"><span class="opt__txt"><b>Neu starten</b><small>Alle Sitzungen enden; Akari OS ist nach etwa einer Minute wieder da.</small></span><button class="f-btn f-btn--sm" data-power="reboot"><svg><use href="#i-refresh"/></svg>Neu starten</button></div>
          <div class="opt"><span class="opt__txt"><b>Ausschalten</b><small>Wieder an geht es nur am Gerät oder in der VM-Verwaltung.</small></span><button class="f-btn f-btn--sm f-btn--danger" data-power="poweroff"><svg><use href="#i-power"/></svg>Ausschalten</button></div>
        </div>
      </section>
    </main>
  </div>
</template>

<dialog class="f-dialog" id="dlg-ask">
  <form class="f-glass f-glass--hi f-glass--deep dlg" method="dialog">
    <h3 class="f-h3" data-title></h3>
    <p class="f-dim" data-text></p>
    <label class="f-field" data-field hidden><span data-label></span><input class="f-input" name="value" autocomplete="off" spellcheck="false"></label>
    <div class="dlg__foot"><button class="f-btn f-btn--ghost" value="cancel" formnovalidate>Abbrechen</button><button class="f-btn f-btn--primary" value="ok" data-ok>OK</button></div>
  </form>
</dialog>
</body>
</html>
