# Akari OS as a server (akari-server): the network and memory for a machine that serves.
# BBR with fair queueing: steadier throughput on real links, fewer stalls on lossy ones
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# a longer queue of waiting connections, for Caddy and whatever runs in Docker
net.core.somaxconn = 4096
# swap only when memory is really short (zram first: it is compressed RAM)
vm.swappiness = 10
# file watchers for editors, build tools and sync clients
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
