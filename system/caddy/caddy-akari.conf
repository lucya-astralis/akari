# Akari OS: Caddy serves Akari (HTTPS in front of akarid), with Akari's own
# Caddyfile; /etc/caddy/Caddyfile stays as the caddy package left it.
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/akari/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/akari/Caddyfile --force
