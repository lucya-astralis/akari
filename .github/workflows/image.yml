# Builds the Akari container for amd64 and arm64 and pushes it to
# ghcr.io/lucya-astralis/<IMAGE>. Tags, as lucya-aio pulls them:
#   container-0.10  -> :stable
#   every build     -> :sha-<short>
name: image

# Frozen on Akari 0.10: main is becoming the Akari OS distribution (docs/distro.md),
# so only the branch container-0.10 still builds the container that Lucent's
# store offers (:stable). Fixes for it go to that branch.
on:
  push:
    branches: [container-0.10]
  workflow_dispatch:

env:
  IMAGE: akari

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/container-0.10' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
