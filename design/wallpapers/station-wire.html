<!doctype html>
<!-- LSV-01 Astralis's edges for design/wallpapers/station.py. Copy sc-branding's
     station/js folder next to this page, serve the folder with a server that
     takes POST /save (writes the body to a file), open the page: it builds the
     station from parts.js, finds the edges where the hull folds, projects them
     from a three-quarter view and posts them, near to far in four paths. -->
<meta charset="utf-8">
<title>wire</title>
<body style="background:#111;color:#ccc;font:14px monospace">
<pre id="log">building…</pre>
<script type="module">
import * as THREE from './js/vendor/three.bundle.min.js';
import { buildStation } from './js/parts.js';

const log = t => { document.getElementById('log').textContent += '\n' + t; };
const W = 3840, H = 2160;

const mats = {};
const M = new Proxy(mats, { get: (t, k) => (t[k] ||= new THREE.MeshStandardMaterial()) });
const lights = { add() {} };
const ship = buildStation(M, lights, { shadows: false });
const root = ship.root;
root.updateMatrixWorld(true);
log(`bounds front ${ship.bounds.front} back ${ship.bounds.back} length ${(ship.bounds.front - ship.bounds.back).toFixed(1)}`);

// a three-quarter view from starboard, a little above, the bow to the right
const centre = new THREE.Vector3(0, 0, (ship.bounds.front + ship.bounds.back) / 2);
const view = (dir, fov) => {
  const cam = new THREE.PerspectiveCamera(fov, W / H, 1, 20000);
  cam.position.copy(centre).add(new THREE.Vector3(...dir).normalize().multiplyScalar(2600));
  cam.lookAt(centre);
  cam.updateMatrixWorld(true);
  cam.updateProjectionMatrix();
  return cam;
};

// the edges where the surface folds (or ends), as EdgesGeometry finds them: three's bundle here has no EdgesGeometry
function edges(geo, thresholdDeg) {
  const pos = geo.attributes.position, idx = geo.index;
  const n = idx ? idx.count : pos.count;
  const cos = Math.cos(thresholdDeg * Math.PI / 180);
  const key = i => `${Math.round(pos.getX(i) * 100)},${Math.round(pos.getY(i) * 100)},${Math.round(pos.getZ(i) * 100)}`;
  const map = new Map();
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3();
  for (let f = 0; f < n; f += 3) {
    const vi = [0, 1, 2].map(j => idx ? idx.getX(f + j) : f + j);
    A.fromBufferAttribute(pos, vi[0]); B.fromBufferAttribute(pos, vi[1]); C.fromBufferAttribute(pos, vi[2]);
    N.subVectors(C, B).cross(A.clone().sub(B));
    if (N.lengthSq() < 1e-12) continue;
    N.normalize();
    const ks = vi.map(key);
    for (let j = 0; j < 3; j++) {
      const k0 = ks[j], k1 = ks[(j + 1) % 3];
      const id = k0 < k1 ? k0 + '|' + k1 : k1 + '|' + k0;
      const e = map.get(id);
      if (e) e.n2 = N.clone();
      else map.set(id, { a: vi[j], b: vi[(j + 1) % 3], n1: N.clone(), n2: null });
    }
  }
  const out = [];
  for (const e of map.values()) {
    if (e.n2 && e.n1.dot(e.n2) > cos) continue;
    out.push(pos.getX(e.a), pos.getY(e.a), pos.getZ(e.a), pos.getX(e.b), pos.getY(e.b), pos.getZ(e.b));
  }
  return out;
}

function draw({ dir, fov, box, threshold, name }) {
  const cam = view(dir, fov);
  const segs = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh) return;
    const p = edges(o.geometry, threshold);
    for (let i = 0; i < p.length; i += 6) {
      a.set(p[i], p[i + 1], p[i + 2]).applyMatrix4(o.matrixWorld);
      b.set(p[i + 3], p[i + 4], p[i + 5]).applyMatrix4(o.matrixWorld);
      const da = a.distanceTo(cam.position), db = b.distanceTo(cam.position);
      const pa = a.clone().project(cam), pb = b.clone().project(cam);
      segs.push([pa.x, -pa.y, pb.x, -pb.y, (da + db) / 2]);
    }
  });
  // fit the drawing into its box on the screen
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, d0 = Infinity, d1 = -Infinity;
  for (const [ax, ay, bx, by, d] of segs) {
    x0 = Math.min(x0, ax, bx); x1 = Math.max(x1, ax, bx); y0 = Math.min(y0, ay, by); y1 = Math.max(y1, ay, by);
    d0 = Math.min(d0, d); d1 = Math.max(d1, d);
  }
  const [bx0, by0, bw, bh] = box;
  const k = Math.min(bw / (x1 - x0), bh / (y1 - y0));
  const ox = bx0 + (bw - (x1 - x0) * k) / 2 - x0 * k, oy = by0 + (bh - (y1 - y0) * k) / 2 - y0 * k;
  // four depths: the near side strong, the far side faint
  const buckets = [[], [], [], []];
  const r = v => Math.round(v * 10) / 10;
  let kept = 0;
  for (const [ax, ay, bx, by, d] of segs) {
    const X0 = ax * k + ox, Y0 = ay * k + oy, X1 = bx * k + ox, Y1 = by * k + oy;
    if (Math.hypot(X1 - X0, Y1 - Y0) < 0.8) continue;
    const t = (d - d0) / (d1 - d0 || 1);
    buckets[Math.min(3, Math.floor(t * 4))].push(`M${r(X0)} ${r(Y0)}L${r(X1)} ${r(Y1)}`);
    kept++;
  }
  log(`${name}: ${segs.length} edges, ${kept} drawn`);
  return buckets.map(b => b.join(''));
}

const shots = {
  side: draw({ name: 'side', dir: [1, 0.42, 0.38], fov: 14, box: [700, 470, 2440, 1200], threshold: 28 }),
};
shots.length = ship.bounds.front - ship.bounds.back;
await fetch('/save', { method: 'POST', body: JSON.stringify(shots) });
log('saved');
window.done = true;
</script>
