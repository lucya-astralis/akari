<title>Akari Showcase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="facet.css">
<style>
/* Akari Showcase. Layout: two keynote stages, each a bento of four columns
   (areas below), on Facet's own ground; tiles are white glass cards, the
   middle tile carries the title on Nova. Colours come from Facet's tokens,
   which follow light and dark by themselves (light-dark, color-scheme). */
:root{
  --u: 1cqw;              /* the unit of everything drawn small: a hundredth of its container */
  --tile: var(--surface);
  --tile-line: var(--stroke-1);
  --tile-r: 26px;
  --gap: 14px;
}
body{ background:var(--bg); color:var(--text); font-family:var(--sans) }

.show{ max-width:1280px; margin:0 auto; display:grid; gap:28px;
  padding-block:48px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)) }
.eyebrow{ font:600 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--acc) }
.stage__head{ display:grid; gap:10px; justify-items:center; text-align:center; padding-top:20px }
.stage__head h1{ margin:0; font:700 clamp(30px, 4.4vw, 52px)/1.05 var(--sans); letter-spacing:-.03em; text-wrap:balance }
.stage__head p{ margin:0; max-width:56ch; color:var(--text-dim); font-size:16px; line-height:1.5; text-wrap:balance }
.show__foot{ display:flex; align-items:center; justify-content:center; gap:10px; color:var(--text-ghost); font:500 12px var(--mono); padding-top:12px }
.show__foot .am{ width:14px; height:15px }

/* the mark, as Akari draws it */
.am-l{ fill:var(--acc) } .am-b{ fill:var(--text) } .am-d{ fill:var(--text-ghost) }

/* ---------- the stages ---------- */
.stage{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:var(--gap); align-items:stretch }
.tile{ margin:0; min-width:0; position:relative; border-radius:var(--tile-r); background:var(--tile); border:1px solid var(--tile-line);
  box-shadow:var(--shadow-4); overflow:clip }
@media (min-width: 1000px){
  .stage--looks{ grid-template-areas:"a b c c" "d t t e" "f t t g" "h h i j" }
  .stage--feats{ grid-template-areas:"a b c c" "a h h d" "e h h f" "g g i f" "j k k l" }
  [data-ga="a"]{ grid-area:a } [data-ga="b"]{ grid-area:b } [data-ga="c"]{ grid-area:c } [data-ga="d"]{ grid-area:d }
  [data-ga="e"]{ grid-area:e } [data-ga="f"]{ grid-area:f } [data-ga="g"]{ grid-area:g } [data-ga="h"]{ grid-area:h }
  [data-ga="i"]{ grid-area:i } [data-ga="j"]{ grid-area:j } [data-ga="k"]{ grid-area:k } [data-ga="l"]{ grid-area:l }
  [data-ga="t"]{ grid-area:t }
}
@media (min-width: 641px) and (max-width: 999px){
  .stage{ grid-template-columns:repeat(2, minmax(0, 1fr)) }
  .is-wide, [data-ga="t"], [data-ga="h"].feat{ grid-column:span 2 }
}
@media (max-width: 640px){
  .stage{ grid-template-columns:minmax(0, 1fr) }
}

/* stage 1: a desktop and what makes its look */
.tile--look{ display:grid; grid-template-rows:auto 1fr }
.tile--look .mini{ border-radius:var(--tile-r) var(--tile-r) 0 0 }
.tile--look figcaption{ display:grid; gap:8px; align-content:start; padding:14px 16px 16px }
.tile--look figcaption b{ font:600 16px/1.2 var(--sans) }
.chips{ display:flex; flex-wrap:wrap; gap:6px }
.chip{ padding:3px 8px; border-radius:var(--r-pill); background:var(--surface-2); color:var(--text-dim); font:500 11px/1.3 var(--sans) }
@media (min-width: 1000px){
  /* wide tiles: the desktop at the same height as its neighbours, the words beside it */
  .tile--look.is-wide{ grid-template-columns:calc(50% - var(--gap) / 2) 1fr; grid-template-rows:auto }
  .tile--look.is-wide .mini{ border-radius:var(--tile-r) 0 0 var(--tile-r) }
  .tile--look.is-wide figcaption{ align-content:center; padding:20px 24px; gap:12px }
  .tile--look.is-wide figcaption b{ font-size:22px }
}
.tile--title{ display:grid; align-content:center; justify-items:center; gap:14px; text-align:center; padding:36px 28px; min-height:280px; border:0 }
.tile--title h2, .hero__title{ margin:0; font:700 clamp(34px, 4.6vw, 64px)/1 var(--sans); letter-spacing:-.035em; text-wrap:balance;
  background:linear-gradient(100deg, oklch(.62 .2 var(--tint-h)), oklch(.66 .19 calc(var(--tint-h) + 70)), oklch(.7 .18 calc(var(--tint-h) + 150)));
  -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em }
.tile--title p{ margin:0; max-width:34ch; color:var(--text-dim); font-size:15px; line-height:1.5 }

/* ---------- a look of its own: Akari's tint, scoped to one element ----------
   Facet sets these on :root[data-tint]; here every .look carries its own hue
   (--tint-h), its scheme (light or dark) and Nova's side. */
.look{
  --acc:        light-dark(oklch(.52 .20 var(--tint-h)), oklch(.68 .16 var(--tint-h)));
  --acc-fill:   light-dark(oklch(.52 .20 var(--tint-h)), oklch(.58 .19 var(--tint-h)));
  --acc-soft:   light-dark(oklch(.52 .20 var(--tint-h) / .09), oklch(.68 .16 var(--tint-h) / .16));
  --nova-a:     light-dark(oklch(.86 .07 var(--tint-h)), oklch(.40 .19 var(--tint-h)));
  --nova-b:     light-dark(oklch(.93 .035 var(--tint-h)), oklch(.25 .11 var(--tint-h)));
  --nova-c:     light-dark(oklch(.96 .012 var(--tint-h)), oklch(.13 .04 var(--tint-h)));
  --nova-shard: light-dark(oklch(.62 .16 var(--tint-h) / .26), oklch(.60 .17 var(--tint-h) / .55));
  --nova-shard-2: light-dark(oklch(.45 .20 var(--tint-h) / .12), oklch(.42 .18 var(--tint-h) / .35));
  --nova-line:  light-dark(oklch(.58 .20 var(--tint-h) / .55), oklch(.72 .15 var(--tint-h) / .90));
  --nova-glow:  light-dark(oklch(.82 .09 var(--tint-h) / .50), oklch(.52 .22 var(--tint-h) / .42));
  --nova-edge:  light-dark(oklch(1 0 0 / .85), oklch(.88 .07 var(--tint-h) / .38));
  --nova-halo:  light-dark(oklch(.62 .16 var(--tint-h) / .16), oklch(.72 .15 var(--tint-h) / .22));
  color:var(--text);
}
.look--light{ color-scheme:light } .look--dark{ color-scheme:dark }
.look[data-side="right"]{ --nova-angle:-68deg; --nova-x:100%; --nova-dir:-1 }
.look[data-side="both"].f-nova::after{ background:
  var(--nova-grain),
  linear-gradient(-68deg, transparent 0 6%, var(--nova-edge) 6% 6.12%, transparent 6.12%),
  linear-gradient(-68deg, transparent 0 21%, var(--nova-silver) 21% 21.2%, transparent 21.2%),
  linear-gradient(-68deg, transparent 0 26%, var(--nova-line) 26% 26.3%, transparent 26.3%),
  linear-gradient(-68deg, transparent 23.6%, var(--nova-halo) 26.15%, transparent 29.4%),
  linear-gradient(-68deg, transparent 0 6%, var(--nova-shard) 6% 14%, var(--nova-shard-2) 14% 19%, transparent 19%),
  radial-gradient(ellipse 62% 78% at 100% 14%, var(--nova-glow), transparent 68%),
  linear-gradient(-68deg, var(--nova-a) 0%, var(--nova-b) 18%, color-mix(in srgb, var(--nova-c) 55%, transparent) 34%, transparent 46%) }
.look--spectrum{ animation:look-walk 60s linear infinite;
  --nova-b:     light-dark(oklch(.93 .045 calc(var(--tint-h) + 70)), oklch(.27 .12 calc(var(--tint-h) + 70)));
  --nova-c:     light-dark(oklch(.96 .016 calc(var(--tint-h) + 140)), oklch(.14 .05 calc(var(--tint-h) + 140)));
  --nova-shard: light-dark(oklch(.64 .17 calc(var(--tint-h) + 90) / .30), oklch(.60 .18 calc(var(--tint-h) + 90) / .58));
  --nova-shard-2: light-dark(oklch(.50 .20 calc(var(--tint-h) + 180) / .16), oklch(.45 .19 calc(var(--tint-h) + 180) / .40));
  --nova-line:  light-dark(oklch(.60 .21 calc(var(--tint-h) + 210) / .60), oklch(.74 .16 calc(var(--tint-h) + 210) / .92));
  --nova-halo:  light-dark(oklch(.64 .17 calc(var(--tint-h) + 260) / .18), oklch(.72 .16 calc(var(--tint-h) + 260) / .26));
  --nova-glow:  light-dark(oklch(.82 .11 calc(var(--tint-h) + 300) / .55), oklch(.55 .22 calc(var(--tint-h) + 300) / .46)) }
.look--rainbow{ animation:look-walk 24s linear infinite }
@keyframes look-walk{ from{ --tint-h:0 } to{ --tint-h:360 } }
.look--plain.f-nova::before, .look--plain.f-nova::after{ display:none }
.look--plain.f-nova{ background:light-dark(#eef0f5, #101119) }
@media (prefers-reduced-motion: reduce){ .look--spectrum, .look--rainbow{ animation:none } }

/* ---------- a desktop in small: everything sized by its width (cqw) ---------- */
.mini{ position:relative; width:100%; max-width:100%; aspect-ratio:16 / 10; container-type:inline-size; overflow:clip; font-family:var(--sans) }
.mini > *{ position:absolute }
.glassy{ background:color-mix(in oklab, var(--surface) 74%, transparent); -webkit-backdrop-filter:blur(10px) saturate(1.3); backdrop-filter:blur(10px) saturate(1.3);
  box-shadow:0 calc(.5 * var(--u)) calc(2 * var(--u)) rgb(0 0 0 / .14), inset 0 0 0 1px color-mix(in oklab, var(--text) 7%, transparent) }
.mini__bar{ left:calc(2 * var(--u)); right:calc(2 * var(--u)); bottom:calc(1.8 * var(--u)); display:flex; justify-content:center; gap:calc(1.6 * var(--u)) }
.mini[data-top="1"] .mini__bar{ top:calc(1.8 * var(--u)); bottom:auto }
.mini__bar[data-align="left"]{ justify-content:flex-start } .mini__bar[data-align="right"]{ justify-content:flex-end }
.mini__bar[data-align="split"]{ justify-content:space-between }
.mb{ display:flex; align-items:center; gap:calc(.9 * var(--u)); height:calc(5.4 * var(--u)); padding:0 calc(1.3 * var(--u)); border-radius:calc(2 * var(--u));
  background:color-mix(in oklab, var(--surface) 74%, transparent); -webkit-backdrop-filter:blur(10px) saturate(1.3); backdrop-filter:blur(10px) saturate(1.3);
  box-shadow:0 calc(.5 * var(--u)) calc(2 * var(--u)) rgb(0 0 0 / .14), inset 0 0 0 1px color-mix(in oklab, var(--text) 8%, transparent); white-space:nowrap }
.mb .ic{ width:calc(3.3 * var(--u)); height:calc(3.3 * var(--u)) }
.mb .li{ width:calc(1.7 * var(--u)); height:calc(1.7 * var(--u)); color:var(--text) }
.mb__mark{ width:calc(1.9 * var(--u)); height:calc(2 * var(--u)) }
.mb__sep{ width:1px; height:calc(2.3 * var(--u)); background:color-mix(in oklab, var(--text) 16%, transparent) }
.mb__desk{ display:flex; align-items:center; gap:calc(.5 * var(--u)); font-size:calc(1.05 * var(--u)); color:var(--text-dim) }
.mb__clock{ display:grid; justify-items:end; line-height:1.1 }
.mb__clock b{ font:600 calc(1.35 * var(--u)) var(--mono) } .mb__clock small{ font:400 calc(.8 * var(--u)) var(--mono); color:var(--text-dim) }
.mb__media{ display:flex; align-items:center; gap:calc(.6 * var(--u)) }
.mb__media span{ display:grid; line-height:1.15 } .mb__media b{ font-size:calc(1.05 * var(--u)) } .mb__media small{ font-size:calc(.85 * var(--u)); color:var(--text-dim) }
.mb__cover{ width:calc(3.4 * var(--u)); height:calc(3.4 * var(--u)); border-radius:calc(.9 * var(--u)); background:linear-gradient(135deg, oklch(.7 .17 var(--tint-h)), oklch(.5 .2 calc(var(--tint-h) + 60))) }
.mb__min{ width:calc(4.2 * var(--u)); height:calc(3.3 * var(--u)); border-radius:calc(.7 * var(--u)); background:var(--surface); box-shadow:inset 0 0 0 1px var(--stroke-1), 0 calc(.2 * var(--u)) calc(.6 * var(--u)) rgb(0 0 0 / .1) }

.mini__widgets{ left:calc(2 * var(--u)); top:calc(2 * var(--u)); width:calc(18 * var(--u)); display:grid; gap:calc(1 * var(--u)) }
.mini[data-top="1"] .mini__widgets{ top:calc(9.5 * var(--u)) }
.mwg{ border-radius:calc(1.5 * var(--u)); padding:calc(1.1 * var(--u)) calc(1.3 * var(--u)); display:grid; gap:calc(.3 * var(--u));
  background:color-mix(in oklab, var(--surface) 78%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 calc(.4 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .1), inset 0 0 0 1px color-mix(in oklab, var(--text) 7%, transparent) }
.mwg small{ font-size:calc(.8 * var(--u)); color:var(--text-dim) }
.mwg--clock b{ font:700 calc(3.2 * var(--u))/1 var(--sans); letter-spacing:-.03em }
.mwg--perf i{ height:calc(.6 * var(--u)); border-radius:calc(1 * var(--u)); background:linear-gradient(90deg, var(--acc) calc(var(--v) * 100%), color-mix(in oklab, var(--text) 10%, transparent) 0) }
.spark{ height:calc(1.8 * var(--u)); background:linear-gradient(170deg, transparent 45%, var(--acc) 46% 52%, transparent 53%) left / 50% 100% no-repeat,
  linear-gradient(15deg, transparent 45%, var(--acc) 46% 52%, transparent 53%) right / 50% 100% no-repeat }
.mwg--note{ height:calc(7 * var(--u)) }

.mini__icons{ right:calc(2.4 * var(--u)); top:calc(2.4 * var(--u)); display:grid; gap:calc(1.5 * var(--u)); justify-items:center }
.mini__icons span{ display:grid; justify-items:center; gap:calc(.3 * var(--u)) }
.mini__icons .ic{ width:calc(4.6 * var(--u)); height:calc(4.6 * var(--u)); filter:drop-shadow(0 calc(.3 * var(--u)) calc(.6 * var(--u)) rgb(0 0 0 / .18)) }
.mini__icons small{ font-size:calc(.75 * var(--u)); color:var(--text) }

.mini__logo{ top:50%; width:calc(15 * var(--u)); height:auto; aspect-ratio:95.64 / 100; translate:0 -62%;
  filter:drop-shadow(0 0 calc(4 * var(--u)) var(--nova-glow)) drop-shadow(0 calc(.3 * var(--u)) calc(1 * var(--u)) rgb(0 0 0 / .12)) }
.mini__logo--lucya{ width:calc(24 * var(--u)); aspect-ratio:964 / 543; color:color-mix(in oklab, var(--text) 78%, transparent); fill:currentColor }
.mini[data-side="left"] .mini__logo{ right:calc(21 * var(--u)) } .mini[data-side="right"] .mini__logo{ left:calc(24 * var(--u)) }
.mini[data-side="both"] .mini__logo{ left:50%; translate:-50% -62% }

/* windows */
.mwin{ left:calc(23 * var(--u)); top:calc(8 * var(--u)); width:calc(52 * var(--u)); height:calc(47 * var(--u)); border-radius:calc(1.6 * var(--u)); overflow:clip; display:grid; grid-template-rows:calc(3.4 * var(--u)) 1fr;
  background:var(--surface); box-shadow:0 calc(1.4 * var(--u)) calc(4 * var(--u)) rgb(0 0 0 / .22), inset 0 0 0 1px color-mix(in oklab, var(--text) 9%, transparent) }
.mini[data-top="1"] .mwin{ top:calc(11 * var(--u)) }
.mw__dots{ position:absolute; left:calc(1.2 * var(--u)); top:calc(1.15 * var(--u)); display:flex; gap:calc(.6 * var(--u)) }
.mw__dots i{ width:calc(1.05 * var(--u)); height:calc(1.05 * var(--u)); border-radius:50%; background:#ff5f57 } .mw__dots i + i{ background:#febc2e } .mw__dots i + i + i{ background:#28c840 }
.mwin__title{ align-self:center; justify-self:center; font:500 calc(1.05 * var(--u)) var(--sans); color:var(--text-dim) }
.mwin__body{ min-height:0; display:grid; overflow:clip }
.mwin--term .mwin__body{ grid-template-columns:auto 1fr; gap:calc(2 * var(--u)); padding:calc(1.5 * var(--u)) calc(2 * var(--u)); align-items:start }
.ff{ margin:0; font:400 calc(1.02 * var(--u))/1.06 var(--mono); color:var(--text); white-space:pre }
.ff1{ color:var(--acc) } .ff2{ color:var(--text) }
.ffi{ display:grid; gap:calc(.25 * var(--u)); font:400 calc(.95 * var(--u))/1.3 var(--mono); padding-top:calc(1 * var(--u)) }
.ffi b{ font-weight:600 } .ffi b span{ color:var(--acc) }
.ffi i{ height:1px; background:var(--stroke-1); margin:calc(.3 * var(--u)) 0 }
.ffi p{ margin:0; white-space:nowrap } .ffi p span{ display:inline-block; width:calc(7 * var(--u)); color:var(--acc); font-weight:600 }
.mwin--files .mwin__body, .mwin--set .mwin__body{ grid-template-columns:calc(12 * var(--u)) 1fr }
.mwin aside{ background:var(--surface-2); padding:calc(1.2 * var(--u)) calc(1 * var(--u)); display:grid; align-content:start; gap:calc(.4 * var(--u)) }
.mwin aside p{ margin:0; padding:calc(.5 * var(--u)) calc(.8 * var(--u)); border-radius:calc(.7 * var(--u)); font-size:calc(.95 * var(--u)); color:var(--text-dim) }
.mwin aside p.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1) }
.fgrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:calc(1.6 * var(--u)); padding:calc(2 * var(--u)); align-content:start }
.fcell{ display:grid; justify-items:center; gap:calc(.4 * var(--u)) } .fcell svg{ width:calc(5.6 * var(--u)); height:calc(5.6 * var(--u)) } .fcell small{ font-size:calc(.85 * var(--u)); color:var(--text-dim) }
.sbody{ padding:calc(1.8 * var(--u)) calc(2.2 * var(--u)); display:grid; gap:calc(1.4 * var(--u)); align-content:start }
.sbody > b{ font:600 calc(1.9 * var(--u)) var(--sans) }
.srow{ display:flex; align-items:center; justify-content:space-between; gap:calc(1 * var(--u)); padding-bottom:calc(1.2 * var(--u)); border-bottom:1px solid var(--stroke-1); font-size:calc(1 * var(--u)) }
.sw{ display:flex; gap:calc(.6 * var(--u)) }
.sw i{ width:calc(1.8 * var(--u)); height:calc(1.8 * var(--u)); border-radius:50%; background:oklch(.62 .17 var(--h)) }
.sw--rb, .sw .sw--rb{ background:conic-gradient(from 90deg, oklch(.62 .17 0), oklch(.62 .17 90), oklch(.62 .17 180), oklch(.62 .17 270), oklch(.62 .17 360)) }
.sw--sp, .sw .sw--sp{ background:linear-gradient(135deg, oklch(.66 .17 300) 0 25%, oklch(.7 .15 200) 25% 50%, oklch(.74 .15 120) 50% 75%, oklch(.7 .17 30) 75%) }
.seg{ display:flex; padding:calc(.25 * var(--u)); border-radius:calc(1 * var(--u)); background:var(--surface-2) }
.seg i{ padding:calc(.35 * var(--u)) calc(.9 * var(--u)); border-radius:calc(.8 * var(--u)); font:normal calc(.85 * var(--u)) var(--sans); color:var(--text-dim) }
.seg i.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1) }
.mwin--web .mwin__body{ grid-template-rows:auto auto 1fr }
.wtabs{ display:flex; gap:calc(.6 * var(--u)); padding:0 calc(1.2 * var(--u)) }
.wtabs i{ padding:calc(.6 * var(--u)) calc(1.4 * var(--u)); border-radius:calc(.8 * var(--u)) calc(.8 * var(--u)) 0 0; font:normal calc(.9 * var(--u)) var(--sans); color:var(--text-dim) }
.wtabs i.on{ background:var(--surface-2); color:var(--text) }
.wurl{ margin:0 calc(1.2 * var(--u)); padding:calc(.6 * var(--u)) calc(1.2 * var(--u)); border-radius:calc(2 * var(--u)); background:var(--surface-2); font-size:calc(.9 * var(--u)); color:var(--text-dim) }
.wpage{ display:grid; gap:calc(1 * var(--u)); padding:calc(2.4 * var(--u)) calc(3 * var(--u)); align-content:start }
.wh{ height:calc(3 * var(--u)); width:60%; border-radius:calc(.6 * var(--u)); background:linear-gradient(90deg, oklch(.6 .18 var(--tint-h)), oklch(.62 .18 calc(var(--tint-h) + 60))) }
.wl{ height:calc(1 * var(--u)); width:85%; border-radius:calc(.5 * var(--u)); background:color-mix(in oklab, var(--text) 12%, transparent) } .wl.s{ width:55% }
.wcards{ display:grid; grid-template-columns:repeat(3, 1fr); gap:calc(1.2 * var(--u)); margin-top:calc(1 * var(--u)) }
.wcards i{ aspect-ratio:4 / 3; border-radius:calc(1 * var(--u)); background:linear-gradient(135deg, var(--acc-soft), color-mix(in oklab, var(--text) 6%, transparent)) }
/* the control centre, small */
.mcc{ right:calc(2.4 * var(--u)); bottom:calc(9.5 * var(--u)); width:calc(30 * var(--u)); padding:calc(1.2 * var(--u)); border-radius:calc(2 * var(--u)); display:grid; gap:calc(.9 * var(--u));
  background:color-mix(in oklab, var(--surface) 80%, transparent); -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 calc(1.2 * var(--u)) calc(4 * var(--u)) rgb(0 0 0 / .25), inset 0 0 0 1px color-mix(in oklab, var(--text) 9%, transparent) }
.mcc__row{ display:grid; grid-template-columns:1fr 1fr; gap:calc(.9 * var(--u)) }
.mcc__mod{ display:grid; gap:calc(.6 * var(--u)); padding:calc(1 * var(--u)); border-radius:calc(1.4 * var(--u)); background:color-mix(in oklab, var(--surface-2) 85%, transparent) }
.mcc__mod small{ font-size:calc(.8 * var(--u)); color:var(--text-dim) }
.mcc__mod--on .li{ width:calc(2.6 * var(--u)); height:calc(2.6 * var(--u)); padding:calc(.5 * var(--u)); border-radius:50%; background:var(--acc-fill); color:var(--on-acc) }
.mcc__orbs{ display:flex; gap:calc(.6 * var(--u)) } .mcc__orbs i{ width:calc(2.6 * var(--u)); height:calc(2.6 * var(--u)); border-radius:50%; background:var(--surface) } .mcc__orbs i.on{ background:var(--acc-fill) }
.mcc .sw{ flex-wrap:wrap } .mcc .sw i{ width:calc(2 * var(--u)); height:calc(2 * var(--u)) }
.mcc__toggles{ display:grid; grid-template-columns:repeat(4, 1fr); gap:calc(.9 * var(--u)) }
.mcc__toggles i{ display:grid; place-items:center; padding:calc(1 * var(--u)) 0; border-radius:calc(1.4 * var(--u)); background:color-mix(in oklab, var(--surface-2) 85%, transparent) }
.mcc__toggles .li{ width:calc(2.6 * var(--u)); height:calc(2.6 * var(--u)); padding:calc(.5 * var(--u)); border-radius:50%; background:var(--surface); color:var(--text-dim) }
.mcc__toggles i.on .li{ background:var(--acc-fill); color:var(--on-acc) }

/* ---------- stage 2: features ---------- */
.feat{ display:flex; flex-direction:column; gap:16px; padding:22px; min-height:220px }
.feat__head{ display:grid; gap:8px }
.feat__head h3{ margin:0; font:600 21px/1.15 var(--sans); letter-spacing:-.015em; text-wrap:balance }
.feat__head p{ margin:0; color:var(--text-dim); font-size:14px; line-height:1.5; max-width:46ch }
.feat__note{ margin:0; color:var(--text-dim); font-size:13px }
@media (min-width: 1000px){
  .feat.is-wide{ display:grid; grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr); align-items:center; gap:22px }
}
.feat--hero{ align-items:center; justify-content:center; text-align:center; gap:14px; padding:40px 24px; min-height:340px; border:0; color:var(--text) }
.hero__mark{ width:64px; height:67px; filter:drop-shadow(0 0 30px var(--nova-glow)) }
.hero__lede{ margin:0; max-width:30ch; font-size:17px; line-height:1.45; color:var(--text-dim) }
.hero__ver{ font:500 12px var(--mono); color:var(--text-ghost) }
/* terminal */
.term{ flex:1; display:grid; grid-template-columns:minmax(0, 1fr); gap:12px; align-content:start; padding:18px; border-radius:16px;
  background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--stroke-1) }
.term .ff{ font-size:9px; line-height:1.06; overflow:hidden }
.term .ffi{ font-size:11px; gap:3px; padding-top:6px }
.term .ffi p span{ width:72px }
.term .ffi i{ margin:3px 0 }
.prompt{ grid-column:1 / -1; font:400 12px/1.6 var(--mono); color:var(--text) }
.prompt .p1{ color:var(--acc); font-weight:600 } .prompt .p2{ color:var(--text-dim) }
/* cursors */
.curs{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px }
.cur{ display:grid; justify-items:center; gap:4px; padding:10px 4px 8px; border-radius:14px; background:var(--surface-2) }
.cur img{ width:32px; height:32px }
.cur small{ font:400 9.5px var(--mono); color:var(--text-dim); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
/* apps */
.mini--flat{ border-radius:16px; box-shadow:inset 0 0 0 1px var(--stroke-1) }
.mini--flat .mwin{ left:calc(8 * var(--u)); top:calc(8 * var(--u)); width:calc(84 * var(--u)); height:calc(84 * var(--u)) }
.mini--flat .mwin__title{ font-size:calc(2 * var(--u)) } .mini--flat .mw__dots i{ width:calc(1.8 * var(--u)); height:calc(1.8 * var(--u)) } .mini--flat .mw__dots{ left:calc(2 * var(--u)); top:calc(1.8 * var(--u)); gap:calc(1 * var(--u)) }
.mini--flat .mwin{ grid-template-rows:calc(5.6 * var(--u)) 1fr } .mini--flat .wtabs i, .mini--flat .wurl{ font-size:calc(1.6 * var(--u)) } .mini--flat .wh{ height:calc(5 * var(--u)) } .mini--flat .wl{ height:calc(1.6 * var(--u)) }
/* media pill */
.pill{ align-self:center; display:flex; align-items:center; gap:12px; padding:8px 10px 8px 8px; border-radius:999px; background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--stroke-1); max-width:100% }
.pill__cover{ width:42px; height:42px; flex:none; border-radius:12px; background:linear-gradient(135deg, oklch(.7 .17 var(--tint-h)), oklch(.5 .2 calc(var(--tint-h) + 70))) }
.pill span:not(.pill__ctl){ display:grid; line-height:1.2; min-width:0 } .pill b{ font-size:14px } .pill small{ font-size:12px; color:var(--text-dim) }
.pill__ctl{ display:flex; gap:2px } .pill__ctl .li{ width:30px; height:30px; padding:8px; border-radius:50%; color:var(--text) }
/* dock */
.dock{ align-self:center; display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:20px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--stroke-1); max-width:100% }
.dock .ic{ width:26px; height:26px; flex:none }
.dock__mark{ width:18px; height:19px; flex:none }
.dsep{ width:1px; height:20px; background:var(--stroke-1) }
.dmin{ width:32px; height:26px; flex:none; display:grid; place-items:center; border-radius:7px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--stroke-1), 0 1px 3px rgb(0 0 0 / .1) }
.dmin .ic{ width:18px; height:18px }
/* control centre */
.ccw{ flex:1; display:grid; place-items:center; container-type:inline-size; padding:6px }
.ccw{ --u:3.2cqw }
.ccw .mcc{ position:static; width:calc(30 * var(--u)) }
/* lucent */
.lu{ display:grid; gap:10px }
.lu__card{ display:grid; gap:3px; padding:14px 16px; border-radius:16px; background:var(--surface-2) }
.lu__card b{ font-size:17px } .lu__card small{ color:var(--text-dim); font-size:13px }
.lu__state{ display:flex; align-items:center; gap:6px; font:500 11px var(--mono); color:var(--ok) }
.lu__state i{ width:7px; height:7px; border-radius:50%; background:var(--ok) }
.lu__stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px }
.lu__stats span{ display:grid; gap:2px; padding:10px 12px; border-radius:12px; background:var(--surface-2) }
.lu__stats small{ font:500 10px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--text-ghost) } .lu__stats b{ font-size:16px }
.lu__btn{ justify-self:start; padding:8px 14px; border-radius:999px; background:var(--text); color:var(--bg); font-size:13px; font-weight:600 }
/* ssh */
.cmd{ display:block; padding:12px 14px; border-radius:12px; background:var(--surface-2); font:500 13px var(--mono); overflow-x:auto; white-space:nowrap }
/* desktops */
.desks{ display:grid; gap:6px }
.desks span{ display:grid; gap:1px; padding:9px 12px; border-radius:12px; border:1px solid var(--stroke-1) }
.desks span.on{ border-color:var(--acc-line); background:var(--acc-soft) }
.desks b{ font-size:14px } .desks small{ font-size:12px; color:var(--text-dim) }
/* accents */
.accents{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px 8px }
.accents .sw{ display:grid; justify-items:center; gap:6px; font-style:normal }
.accents .sw::before{ content:""; width:34px; height:34px; border-radius:50%; background:oklch(.62 .17 var(--h, 277));
  box-shadow:inset 0 0 0 1px light-dark(rgba(0,0,0,.12), rgba(255,255,255,.18)) }
.accents .sw--rb::before{ background:conic-gradient(from 90deg, oklch(.62 .17 0), oklch(.62 .17 90), oklch(.62 .17 180), oklch(.62 .17 270), oklch(.62 .17 360)) }
.accents .sw--sp::before{ background:linear-gradient(135deg, oklch(.66 .17 300) 0 25%, oklch(.7 .15 200) 25% 50%, oklch(.74 .15 120) 50% 75%, oklch(.7 .17 30) 75%) }
.accents .sw--custom::before{ background:radial-gradient(circle, oklch(.62 .17 320) 0 42%, transparent 44%),
  conic-gradient(from 90deg, oklch(.75 .12 0), oklch(.75 .12 90), oklch(.75 .12 180), oklch(.75 .12 270), oklch(.75 .12 360)) }
.accents .sw--rb, .accents .sw--sp{ background:none }
.accents small{ font-size:11px; color:var(--text-dim) }
/* languages */
.lang{ margin:0; display:grid; gap:4px; font:600 24px/1.2 var(--sans); letter-spacing:-.01em }
.lang span:nth-child(2){ color:var(--text-dim) } .lang span:nth-child(3){ color:var(--acc); font-family:"Noto Sans JP", "Hiragino Sans", var(--sans) }

@media (max-width: 640px){
  .feat--hero{ min-height:260px }
  .accents{ grid-template-columns:repeat(4, 1fr) }
  .term{ grid-template-columns:minmax(0, 1fr) }
}
