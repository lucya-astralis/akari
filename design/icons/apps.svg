<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="416" height="176" viewBox="0 0 416 176">
<rect width="416" height="176" fill="#16161a"/>
  <!-- App icons (design/icons/apps.py, do not edit here): a tile in the app's colour with
       Nova's ray, the motif in two panes of glass. Raw colours are allowed here and only here. -->
  <defs>
    <!-- the clear glass in front: white, lit from above -->
    <linearGradient id="ag-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".82"/></linearGradient>
    <filter id="ag-drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#000" flood-opacity=".22"/></filter>
    <!-- sheen from the top, Nova's ray across, a rim bright above and faint below -->
    <linearGradient id="ag-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ag-ray" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ag-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".55" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
    <clipPath id="ag-tile"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
    <linearGradient id="ag-files" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fb3ff"/><stop offset="1" stop-color="#2450d6"/></linearGradient>
    <linearGradient id="ag-terminal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c5c"/><stop offset="1" stop-color="#121218"/></linearGradient>
    <linearGradient id="ag-music" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a98"/><stop offset="1" stop-color="#8236ec"/></linearGradient>
    <linearGradient id="ag-editor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd666"/><stop offset="1" stop-color="#ee7c0e"/></linearGradient>
    <linearGradient id="ag-web" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa44f"/><stop offset="1" stop-color="#6f4cf6"/></linearGradient>
    <linearGradient id="ag-xterm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d7d90"/><stop offset="1" stop-color="#30303d"/></linearGradient>
    <linearGradient id="ag-settings" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3a9bf"/><stop offset="1" stop-color="#4b5166"/></linearGradient>
    <linearGradient id="ag-tasks" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a796ff"/><stop offset="1" stop-color="#4f38d8"/></linearGradient>
    <linearGradient id="ag-monitor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55e3a6"/><stop offset="1" stop-color="#0c8a5e"/></linearGradient>
    <linearGradient id="ag-window" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48e2c8"/><stop offset="1" stop-color="#0a7f7b"/></linearGradient>
